<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAME START</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/oreui.css">
</head>
<body>
    <oreui-scroll-container>
        <main>
            <!-- 页面标题 -->
            <oreui-page-title-area>
                <oreui-page-title>
                    <oreui-page-title-span>
                        <i class="fas fa-gamepad"></i> GAME START!
                    </oreui-page-title-span>
                </oreui-page-title>
                <span style="color: rgba(255,255,255,0.5); font-size: 14px;">SELECT YOUR GAME</span>
            </oreui-page-title-area>

            <!-- 游戏列表 -->
            <oreui-main-block-frame>
                <oreui-main-block>
                    <div style="display: flex; flex-wrap: wrap; justify-content: center; padding: 8px;">
                        <a href="/" class="btn middle_btn normal_btn">
                            <i class="fas fa-home"></i> 返回主页
                        </a>
                        <a href="../projects" class="btn middle_btn normal_btn">
                            <i class="fas fa-folder-open"></i> 我的项目
                        </a>
                    </div>
                </oreui-main-block>
            </oreui-main-block-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 游戏卡片 -->
            <oreui-main-display-frame>
                <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 10px;">
                    <a href="./spacePlane" class="oreui-show-block" style="width: 240px; min-height: 80px;">
                        <oreui-show-block-title>
                            <i class="fas fa-space-shuttle" style="margin-right: 8px;"></i> 太空战机
                        </oreui-show-block-title>
                        <oreui-show-block-description>
                            穿越星际，对抗外星入侵者
                        </oreui-show-block-description>
                    </a>

                    <a href="./gomoku" class="oreui-show-block" style="width: 240px; min-height: 80px;">
                        <oreui-show-block-title>
                            <i class="fas fa-gamepad" style="margin-right: 8px;"></i> 五子棋
                        </oreui-show-block-title>
                        <oreui-show-block-description>
                            经典策略游戏，挑战你的思维
                        </oreui-show-block-description>
                    </a>

                    <a href="./paintARound" class="oreui-show-block" style="width: 240px; min-height: 80px;">
                        <oreui-show-block-title>
                            <i class="fas fa-paint-brush" style="margin-right: 8px;"></i> 画个圆
                        </oreui-show-block-title>
                        <oreui-show-block-description>
                            创意绘画，释放你的艺术天赋
                        </oreui-show-block-description>
                    </a>

                    <a href="./snakeGame" class="oreui-show-block" style="width: 240px; min-height: 80px;">
                        <oreui-show-block-title>
                            <i class="fas fa-worm" style="margin-right: 8px;"></i> 贪吃蛇
                        </oreui-show-block-title>
                        <oreui-show-block-description>
                            经典街机游戏，挑战你的反应速度
                        </oreui-show-block-description>
                    </a>
                </div>
            </oreui-main-display-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 底部 -->
            <oreui-main-block>
                <div class="page_info">游戏中心 © 2023</div>
            </oreui-main-block>
        </main>
    </oreui-scroll-container>
</body>
</html>
