<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages 主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/oreui.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <oreui-header>
        <oreui-header-left>
            <a href="./about" class="oreui-header-item" style="color: #333;">
                <i class="fas fa-user" style="font-size: 18px;"></i>
            </a>
        </oreui-header-left>
        <oreui-header-logo>
            <oreui-header-title>我的GitHub空间</oreui-header-title>
        </oreui-header-logo>
        <oreui-header-right>
            <a href="https://github.com/hydrooxzgen" class="oreui-header-item" target="_blank" style="color: #333;">
                <i class="fab fa-github" style="font-size: 18px;"></i>
            </a>
        </oreui-header-right>
    </oreui-header>

    <oreui-scroll-container>
        <main>
            <!-- 导航按钮区域 -->
            <oreui-main-block-frame>
                <oreui-main-block>
                    <div style="display: flex; flex-wrap: wrap; justify-content: center; padding: 8px;">
                        <a href="./about" class="btn middle_btn normal_btn">
                            <i class="fas fa-user-circle"></i> 关于
                        </a>
                        <a href="./htmlpages/downloads" class="btn middle_btn normal_btn">
                            <i class="fas fa-download"></i> 下载中心
                        </a>
                        <a href="./games/index" class="btn middle_btn normal_btn">
                            <i class="fas fa-gamepad"></i> 游戏
                        </a>
                        <a href="./repos" class="btn middle_btn primary_btn">
                            <i class="fab fa-github"></i> 我的仓库
                        </a>
                    </div>
                </oreui-main-block>
            </oreui-main-block-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 项目展示 -->
            <oreui-main-display-frame>
                <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 10px;">
                    <a href="./projects" class="oreui-show-block" style="width: 240px; min-height: 80px;">
                        <oreui-show-block-title>
                            <i class="fas fa-code" style="margin-right: 8px;"></i> 项目展示
                        </oreui-show-block-title>
                        <oreui-show-block-description>
                            浏览我创建的各种开源项目
                        </oreui-show-block-description>
                    </a>
                </div>
            </oreui-main-display-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 底部信息 -->
            <oreui-main-block>
                <div class="page_info_title">© 2025 我的GitHub主页</div>
                <div class="page_info">由GitHub Pages托管</div>
            </oreui-main-block>
        </main>
    </oreui-scroll-container>
</body>
</html>
