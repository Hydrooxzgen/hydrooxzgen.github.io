<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的项目 - GitHub 项目展示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            animation: fadeIn 1s ease-out;
        }

        .logo {
            width: 100px;
            height: 100px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .logo i {
            font-size: 40px;
            color: white;
        }

        h1 {
            font-size: 2.8rem;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .tagline {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 20px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            text-decoration: none;
            color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

        .project-icon {
            width: 70px;
            height: 70px;
            border-radius: 18px;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 6px 15px rgba(110, 142, 251, 0.4);
        }

        .project-icon i {
            font-size: 32px;
            color: white;
        }

        .project-card h2 {
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .project-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
            flex: 1;
        }

        .project-meta {
            display: inline-block;
            font-size: 0.85rem;
            color: #6e8efb;
            background: rgba(110, 142, 251, 0.12);
            padding: 5px 14px;
            border-radius: 50px;
            margin-bottom: 18px;
            width: fit-content;
        }

        .project-link {
            color: #6e8efb;
            font-weight: 600;
            font-size: 1rem;
        }

        .project-link i {
            transition: transform 0.3s ease;
        }

        .project-card:hover .project-link i {
            transform: translateX(5px);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin: 40px auto 20px;
            padding: 12px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            border: 2px solid white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.35);
            transform: translateY(-3px);
        }

        footer {
            margin-top: 30px;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            padding-bottom: 20px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-folder-open"></i>
            </div>
            <h1>我的项目</h1>
            <p class="tagline">探索我开发的各类开源项目</p>
        </header>

        <div class="project-grid">
            <a href="./CanApp/" class="project-card">
                <div class="project-icon">
                    <i class="fab fa-python"></i>
                </div>
                <h2>CanApp</h2>
                <p>基于 Python + Tkinter 的多功能 Windows 桌面工具箱，内置三语切换与本地用户系统。</p>
                <span class="project-meta">Python · Tkinter · 多语言</span>
                <span class="project-link">查看详情 <i class="fas fa-arrow-right"></i></span>
            </a>
        </div>

        <div style="text-align: center;">
            <a href="../" class="back-btn">
                <i class="fas fa-arrow-left"></i> 返回主页
            </a>
        </div>

        <footer>
            <p>© 2026 我的GitHub主页 | 由GitHub Pages托管</p>
        </footer>
    </div>
</body>
</html>
