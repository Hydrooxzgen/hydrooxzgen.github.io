<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的项目 - GitHub 项目展示</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/oreui.css">
</head>
<body>
    <oreui-scroll-container>
        <main>
            <!-- 页面标题 -->
            <oreui-page-title-area>
                <oreui-page-title>
                    <oreui-page-title-span>
                        <i class="fas fa-folder-open"></i> 我的项目
                    </oreui-page-title-span>
                </oreui-page-title>
                <span style="color: rgba(255,255,255,0.5); font-size: 14px;">探索我开发的各类开源项目</span>
            </oreui-page-title-area>

            <!-- 项目列表 -->
            <oreui-main-block-frame>
                <oreui-main-block>
                    <div style="padding: 10px; width: 100%; max-width: 550px;">
                        <a href="./CanApp/" class="oreui-show-block" style="width: 100%;">
                            <oreui-show-block-title>
                                <i class="fab fa-python" style="margin-right: 8px;"></i> CanApp
                            </oreui-show-block-title>
                            <oreui-show-block-description>
                                基于 Python + Tkinter 的多功能 Windows 桌面工具箱，内置三语切换与本地用户系统
                            </oreui-show-block-description>
                        </a>
                    </div>
                </oreui-main-block>
            </oreui-main-block-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 返回按钮 -->
            <oreui-main-block>
                <a href="../" class="btn middle_btn normal_btn" style="margin: 8px;">
                    <i class="fas fa-arrow-left"></i> 返回主页
                </a>
            </oreui-main-block>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 底部 -->
            <oreui-main-block>
                <div class="page_info">© 2026 我的GitHub主页 | 由GitHub Pages托管</div>
            </oreui-main-block>
        </main>
    </oreui-scroll-container>
</body>
</html>
