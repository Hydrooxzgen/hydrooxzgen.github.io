<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 下载中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../../css/oreui.css">
</head>
<body>
    <oreui-scroll-container>
        <main>
            <!-- 页面标题 -->
            <oreui-page-title-area>
                <oreui-page-title>
                    <oreui-page-title-span>
                        <i class="fas fa-cube"></i> Minecraft Downloads
                    </oreui-page-title-span>
                </oreui-page-title>
            </oreui-page-title-area>

            <oreui-main-block>
                <div style="padding: 10px; width: 100%; max-width: 550px; text-align: center;">
                    <p>选择您的平台下载 Minecraft</p>
                </div>
            </oreui-main-block>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 安卓系统 -->
            <oreui-main-block-frame>
                <a href="./mcForAndroid" style="text-decoration: none; color: inherit;">
                    <oreui-main-block>
                        <div style="padding: 10px; width: 100%; max-width: 550px;">
                            <oreui-show-block style="width: 100%;">
                                <oreui-show-block-title>
                                    <i class="fab fa-android" style="margin-right: 8px;"></i> 安卓系统
                                </oreui-show-block-title>
                                <oreui-show-block-description>
                                    适用于大多数安卓设备的 Minecraft 版本。请注意不支持 HarmonyOS 5 系统。
                                </oreui-show-block-description>
                            </oreui-show-block>
                        </div>
                    </oreui-main-block>
                </a>
            </oreui-main-block-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- Windows 系统 -->
            <oreui-main-block-frame>
                <a href="./mcForWin" style="text-decoration: none; color: inherit;">
                    <oreui-main-block>
                        <div style="padding: 10px; width: 100%; max-width: 550px;">
                            <oreui-show-block style="width: 100%;">
                                <oreui-show-block-title>
                                    <i class="fab fa-windows" style="margin-right: 8px;"></i> Windows 系统
                                </oreui-show-block-title>
                                <oreui-show-block-description>
                                    适用于 Windows 10 和 11 系统的 Minecraft 桌面版本。
                                </oreui-show-block-description>
                            </oreui-show-block>
                        </div>
                    </oreui-main-block>
                </a>
            </oreui-main-block-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 返回按钮 -->
            <oreui-main-block>
                <a href="../../downloads" class="btn middle_btn normal_btn" style="margin: 8px;">
                    <i class="fas fa-arrow-left"></i> 返回下载中心
                </a>
            </oreui-main-block>

            <!-- 页脚 -->
            <oreui-main-block>
                <div style="padding: 10px; text-align: center; color: var(--oreui-text-muted); font-size: 0.9rem;">
                    &copy; 2023 <span style="color: var(--oreui-accent-yellow);">Minecraft</span> 下载中心 | 本页面仅提供下载指引
                </div>
            </oreui-main-block>
        </main>
    </oreui-scroll-container>
</body>
</html>
