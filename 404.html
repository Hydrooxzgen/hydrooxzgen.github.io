<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/oreui.css">
</head>
<body>
    <oreui-scroll-container>
        <main>
            <!-- 标题区域 -->
            <oreui-page-title-area>
                <oreui-page-title>
                    <oreui-page-title-span style="font-size: 48px;">404</oreui-page-title-span>
                </oreui-page-title>
                <span style="color: rgba(255,255,255,0.5); font-size: 16px;">你所访问的内容不存在</span>
            </oreui-page-title-area>

            <!-- 提示信息 -->
            <oreui-main-block-frame>
                <oreui-main-block>
                    <div style="padding: 16px; font-size: 16px; max-width: 600px;">
                        你尝试访问的所选资源无法找到，请检查你的URL是否正确，然后重试。若你认为这是错误，请刷新界面。无果请联系我们。
                    </div>
                </oreui-main-block>
            </oreui-main-block-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 建议操作 -->
            <oreui-main-display-frame>
                <div style="padding: 10px; width: 100%; max-width: 600px;">
                    <oreui-show-block style="width: 100%; cursor: default;">
                        <oreui-show-block-title>
                            <i class="fas fa-arrow-left" style="margin-right: 8px;"></i> 进入下载中心查看其他可用资源
                        </oreui-show-block-title>
                    </oreui-show-block>
                    <oreui-show-block style="width: 100%; cursor: default; margin-top: 4px;">
                        <oreui-show-block-title>
                            <i class="fas fa-home" style="margin-right: 8px;"></i> 访问网站主页浏览更多内容
                        </oreui-show-block-title>
                    </oreui-show-block>
                    <oreui-show-block style="width: 100%; cursor: default; margin-top: 4px;">
                        <oreui-show-block-title>
                            <i class="fas fa-clock" style="margin-right: 8px;"></i> 稍后再回来查看此页面是否已更新
                        </oreui-show-block-title>
                    </oreui-show-block>
                    <oreui-show-block style="width: 100%; cursor: default; margin-top: 4px;">
                        <oreui-show-block-title>
                            <i class="fas fa-envelope" style="margin-right: 8px;"></i> 联系我们询问此页面的更新计划
                        </oreui-show-block-title>
                    </oreui-show-block>
                </div>
            </oreui-main-display-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 按钮区域 -->
            <oreui-main-block-frame>
                <oreui-main-block>
                    <div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 8px;">
                        <a href="../htmlpages/downloads" class="btn middle_btn primary_btn">
                            <i class="fas fa-arrow-left"></i> 进入下载中心
                        </a>
                        <a href="/" class="btn middle_btn normal_btn">
                            <i class="fas fa-home"></i> 返回主页
                        </a>
                        <button id="refresh-btn" class="btn middle_btn normal_btn">
                            <i class="fas fa-sync-alt"></i> 刷新页面
                        </button>
                        <a href="mailto:tan.allen.mail@gmail.com" class="btn middle_btn normal_btn">
                            <i class="fas fa-envelope"></i> 联系管理员
                        </a>
                    </div>
                </oreui-main-block>
            </oreui-main-block-frame>

            <oreui-main-block-spacing></oreui-main-block-spacing>

            <!-- 底部 -->
            <oreui-main-block>
                <div class="page_info">如果您认为这是一个错误，或者需要立即帮助，请通过上述方式联系我们</div>
                <div class="page_info" style="margin-top: 4px;">快捷键: F5 刷新页面</div>
            </oreui-main-block>
        </main>
    </oreui-scroll-container>

    <script>
        document.getElementById('refresh-btn').addEventListener('click', function() {
            window.location.reload();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F5') {
                e.preventDefault();
                document.getElementById('refresh-btn').click();
            }
        });
        });
    </script>
</body>
</html>
